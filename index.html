<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom — audio visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07070b;
    --panel:#121219;
    --panel-glass:rgba(18,18,25,0.55);
    --hairline:rgba(234,230,221,0.10);
    --hairline-strong:rgba(234,230,221,0.20);
    --bone:#eae6dd;
    --bone-dim:rgba(234,230,221,0.5);
    --bone-faint:rgba(234,230,221,0.28);
    --amber:#e8a855;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--void);
    color:var(--bone);
    font-family:'JetBrains Mono',monospace;
    overflow:hidden;
  }
  #stage{
    position:relative; width:100vw; height:100vh;
  }
  canvas#bloom{
    position:absolute; inset:0; width:100%; height:100%; display:block;
  }

  .hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:28px 32px;
    pointer-events:none;
    z-index:5;
  }
  .track-id{
    max-width:60%;
  }
  .track-id .eyebrow{
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--bone-faint); margin:0 0 8px 0;
  }
  .track-id h1{
    font-family:'Fraunces', serif; font-style:italic; font-weight:400;
    font-size:clamp(20px, 3vw, 34px);
    line-height:1.15; margin:0; color:var(--bone);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .track-id .sub{
    font-size:12px; color:var(--bone-dim); margin-top:6px; letter-spacing:0.02em;
  }
  .readout{
    text-align:right; font-size:11px; color:var(--bone-faint);
    letter-spacing:0.08em; line-height:1.9;
  }
  .readout b{ color:var(--bone-dim); font-weight:400; }

  .idle-msg{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; z-index:4; pointer-events:none;
    transition:opacity 0.6s ease;
  }
  .idle-msg .eyebrow{
    font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--bone-faint); margin:0 0 14px;
  }
  .idle-msg h2{
    font-family:'Fraunces', serif; font-style:italic; font-weight:300;
    font-size:clamp(26px, 4.2vw, 46px); margin:0; color:var(--bone);
  }

  .dock{
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:18px;
    background:var(--panel-glass);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--hairline);
    border-top:1px solid var(--hairline-strong);
    border-radius:100px;
    padding:12px 22px;
    z-index:6;
    max-width:min(680px, 92vw);
    width:max-content;
  }
  .dock button{
    background:none; border:none; color:var(--bone); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:50%;
    transition:background 0.2s ease, transform 0.15s ease;
    flex-shrink:0;
  }
  .dock button:hover{ background:rgba(234,230,221,0.08); }
  .dock button:active{ transform:scale(0.92); }
  .dock button:disabled{ opacity:0.3; cursor:default; }
  .dock button:disabled:hover{ background:none; }
  .dock button svg{ width:16px; height:16px; }

  #playBtn{
    width:42px; height:42px;
    border:1px solid var(--hairline-strong);
  }
  #playBtn svg{ width:14px; height:14px; }

  .seek-wrap{
    display:flex; align-items:center; gap:10px;
    flex:1; min-width:160px;
  }
  .time{ font-size:11px; color:var(--bone-dim); width:38px; text-align:center; flex-shrink:0; letter-spacing:0.02em; }

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    flex:1; height:2px; background:var(--hairline-strong);
    border-radius:2px; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
    background:var(--bone); cursor:pointer;
    box-shadow:0 0 8px rgba(234,230,221,0.5);
    transition:transform 0.15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover{ transform:scale(1.25); }
  input[type=range]::-moz-range-thumb{
    width:11px; height:11px; border-radius:50%; border:none;
    background:var(--bone); cursor:pointer;
  }

  .divider{ width:1px; height:22px; background:var(--hairline); flex-shrink:0; }

  #fileInput{ display:none; }

  .upload-label{
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:50%;
    cursor:pointer; color:var(--bone);
    transition:background 0.2s ease, transform 0.15s ease;
    flex-shrink:0;
  }
  .upload-label:hover{ background:rgba(234,230,221,0.08); }
  .upload-label:active{ transform:scale(0.92); }
  .upload-label svg{ width:16px; height:16px; }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); border:0;
  }

  @media (max-width:640px){
    .hud{ padding:20px 18px; }
    .readout{ display:none; }
    .dock{ padding:10px 16px; gap:12px; }
    .time{ width:32px; }
  }
</style>
</head>
<body>

<h1 class="sr-only">Bloom — upload an audio file to see a live radial visualization synced to its frequencies and waveform, with playback controls to play, pause, and seek.</h1>

<div id="stage">
  <canvas id="bloom"></canvas>

  <div class="hud">
    <div class="track-id">
      <p class="eyebrow">Now resonating</p>
      <h1 id="trackName">No track loaded</h1>
      <p class="sub" id="trackSub">Drop a file or use the dock below</p>
    </div>
    <div class="readout" id="readout">
      <div><b id="bpmRead">—</b> est. pulse</div>
      <div><b id="bandRead">—</b> dominant band</div>
    </div>
  </div>

  <div class="idle-msg" id="idleMsg">
    <p class="eyebrow">Bloom</p>
    <h2>Drop a track to begin</h2>
  </div>

  <div class="dock">
    <label for="fileInput" class="upload-label" aria-label="Upload audio file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </label>
    <input type="file" id="fileInput" accept="audio/*">

    <div class="divider"></div>

    <button id="playBtn" disabled aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <div class="seek-wrap">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" disabled>
      <span class="time" id="durTime">0:00</span>
    </div>
  </div>
</div>

<audio id="audioEl" style="display:none"></audio>

<script>
(function(){
  const canvas = document.getElementById('bloom');
  const ctx = canvas.getContext('2d');
  const audioEl = document.getElementById('audioEl');
  const fileInput = document.getElementById('fileInput');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const seek = document.getElementById('seek');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const trackName = document.getElementById('trackName');
  const trackSub = document.getElementById('trackSub');
  const idleMsg = document.getElementById('idleMsg');
  const bpmRead = document.getElementById('bpmRead');
  const bandRead = document.getElementById('bandRead');

  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let W, H, cx, cy;

  function resize(){
    dpr = Math.max(1, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx = W/2; cy = H/2;
  }
  window.addEventListener('resize', resize);
  resize();

  let audioCtx, analyser, sourceNode;
  let freqData, timeData, barCount = 96;
  let barGroups = [];

  function ensureAudioGraph(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.82;
    sourceNode = audioCtx.createMediaElementSource(audioEl);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    buildBarGroups();
  }

  function buildBarGroups(){
    const bins = analyser.frequencyBinCount;
    barGroups = [];
    const minLog = Math.log2(1);
    const maxLog = Math.log2(bins);
    for(let i=0;i<barCount;i++){
      const t0 = i/barCount, t1 = (i+1)/barCount;
      let s = Math.floor(Math.pow(2, minLog + t0*(maxLog-minLog)));
      let e = Math.floor(Math.pow(2, minLog + t1*(maxLog-minLog)));
      if (e<=s) e = s+1;
      if (e>bins) e = bins;
      barGroups.push([s,e]);
    }
  }

  function fmtTime(s){
    if (!isFinite(s)) return '0:00';
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return m+':'+String(sec).padStart(2,'0');
  }

  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    audioEl.src = url;
    ensureAudioGraph();
    audioCtx.resume();
    let name = file.name.replace(/\.[^/.]+$/, '');
    trackName.textContent = name;
    trackName.title = name;
    idleMsg.style.opacity = '0';
    idleMsg.style.pointerEvents = 'none';
    playBtn.disabled = false;
    seek.disabled = false;
    audioEl.addEventListener('loadedmetadata', ()=>{
      durTimeEl.textContent = fmtTime(audioEl.duration);
      trackSub.textContent = fmtTime(audioEl.duration)+' total';
      audioEl.play();
    }, { once:true });
  });

  playBtn.addEventListener('click', ()=>{
    if (!audioCtx) return;
    audioCtx.resume();
    if (audioEl.paused) audioEl.play(); else audioEl.pause();
  });

  audioEl.addEventListener('play', ()=>{
    playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    playBtn.setAttribute('aria-label','Pause');
  });
  audioEl.addEventListener('pause', ()=>{
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    playBtn.setAttribute('aria-label','Play');
  });

  audioEl.addEventListener('timeupdate', ()=>{
    if (!seek.matches(':active')) {
      const pct = (audioEl.currentTime / (audioEl.duration||1)) * 100;
      seek.value = isFinite(pct) ? pct : 0;
    }
    curTimeEl.textContent = fmtTime(audioEl.currentTime);
  });
  audioEl.addEventListener('ended', ()=>{
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  });

  seek.addEventListener('input', ()=>{
    if (audioEl.duration) {
      audioEl.currentTime = (seek.value/100) * audioEl.duration;
    }
  });

  function hueForT(t){
    const stops = [
      [0.00, 45], [0.14, 15], [0.28, 340], [0.42, 300],
      [0.56, 255], [0.68, 210], [0.80, 175], [0.90, 140], [1.00, 95]
    ];
    for(let i=0;i<stops.length-1;i++){
      const [t0,h0] = stops[i], [t1,h1] = stops[i+1];
      if (t>=t0 && t<=t1){
        const f = (t-t0)/(t1-t0);
        let dh = h1-h0;
        return h0 + dh*f;
      }
    }
    return stops[stops.length-1][1];
  }

  let particles = [];
  let bassAvgHistory = [];
  let lastBeatTime = 0;
  let beatIntervals = [];
  let rotation = 0;
  let hueDrift = 0;
  let idlePhase = 0;

  function spawnParticles(n, baseRadius, hue){
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2;
      particles.push({
        ang, radius: baseRadius * (0.94+Math.random()*0.1),
        speed: 0.6 + Math.random()*1.6,
        hue: hue + (Math.random()*50-25),
        life: 1,
        decay: 0.006 + Math.random()*0.01,
        size: 1 + Math.random()*2.2
      });
    }
    if (particles.length > 500) particles.splice(0, particles.length-500);
  }

  function draw(){
    requestAnimationFrame(draw);

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(7,7,11,0.22)';
    ctx.fillRect(0,0,W,H);

    const minDim = Math.min(W,H);
    const coreBase = minDim * 0.07;
    const ringInner = minDim * 0.12;
    const ringMax = minDim * 0.30;

    let bassAvg=0, midAvg=0, trebAvg=0, overallAvg=0;

    if (analyser && !audioEl.paused){
      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);
    } else if (!analyser){
      idlePhase += 0.012;
    }

    if (analyser){
      const bins = freqData.length;
      let bassN=0, midN=0, trebN=0;
      for(let i=0;i<bins;i++){
        const v = freqData[i];
        overallAvg += v;
        const frac = i/bins;
        if (frac<0.12){ bassAvg+=v; bassN++; }
        else if (frac<0.5){ midAvg+=v; midN++; }
        else { trebAvg+=v; trebN++; }
      }
      overallAvg/=bins;
      bassAvg/= Math.max(1,bassN);
      midAvg/= Math.max(1,midN);
      trebAvg/= Math.max(1,trebN);
    }

    bassAvgHistory.push(bassAvg);
    if (bassAvgHistory.length>43) bassAvgHistory.shift();
    const runningBassAvg = bassAvgHistory.reduce((a,b)=>a+b,0)/Math.max(1,bassAvgHistory.length);

    const now = performance.now();
    if (analyser && !audioEl.paused && bassAvg > runningBassAvg*1.22 && bassAvg > 60 && now-lastBeatTime > 260){
      if (lastBeatTime>0){
        const interval = now-lastBeatTime;
        beatIntervals.push(interval);
        if (beatIntervals.length>10) beatIntervals.shift();
      }
      lastBeatTime = now;
      const hue = hueForT(Math.random()) + hueDrift;
      spawnParticles(12, ringMax*0.9, hue);
    }

    if (beatIntervals.length>=3){
      const avgInt = beatIntervals.reduce((a,b)=>a+b,0)/beatIntervals.length;
      const bpm = Math.round(60000/avgInt);
      if (bpm>40 && bpm<220) bpmRead.textContent = bpm;
    }

    let dominantIdx=0, dominantVal=0;
    if (analyser){
      for(let i=0;i<barGroups.length;i++){
        const [s,e] = barGroups[i];
        let sum=0;
        for(let j=s;j<e;j++) sum+=freqData[j];
        const v = sum/(e-s);
        if (v>dominantVal){ dominantVal=v; dominantIdx=i; }
      }
      const t = dominantIdx/barCount;
      let bandName = t<0.15?'sub-bass':t<0.35?'bass':t<0.6?'low-mid':t<0.8?'high-mid':'treble';
      if (dominantVal>15) bandRead.textContent = bandName;
    }

    hueDrift = (hueDrift + 0.045) % 60;

    ctx.save();
    ctx.translate(cx,cy);
    rotation += 0.0009 + overallAvg*0.000015;
    ctx.rotate(rotation);

    ctx.globalCompositeOperation = 'lighter';

    if (analyser){
      for(let i=0;i<barCount;i++){
        const [s,e] = barGroups[i];
        let sum=0;
        for(let j=s;j<e;j++) sum+=freqData[j];
        const v = (sum/(e-s))/255;
        const ang = (i/barCount)*Math.PI*2;
        const len = ringInner + v*(ringMax-ringInner);
        const hue = hueForT(i/barCount) + hueDrift;
        const x0 = Math.cos(ang)*ringInner, y0 = Math.sin(ang)*ringInner;
        const x1 = Math.cos(ang)*len, y1 = Math.sin(ang)*len;
        ctx.strokeStyle = `hsla(${hue},78%,${58+v*10}%,${0.22+v*0.55})`;
        ctx.lineWidth = Math.max(1.4, (Math.PI*2*ringInner/barCount)*0.55);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x0,y0);
        ctx.lineTo(x1,y1);
        ctx.stroke();
      }

      const wfRadius = ringMax*1.02;
      ctx.beginPath();
      const step = Math.floor(timeData.length/220);
      for(let i=0;i<timeData.length;i+=step){
        const amp = (timeData[i]-128)/128;
        const ang = (i/timeData.length)*Math.PI*2;
        const r = wfRadius + amp*minDim*0.045;
        const x = Math.cos(ang)*r, y = Math.sin(ang)*r;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle = `hsla(${hueForT(0.5)+hueDrift},60%,72%,0.35)`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    const pulse = coreBase + (analyser? (bassAvg/255)*coreBase*1.4 : Math.sin(idlePhase)*coreBase*0.15);
    const coreHue = hueForT(0.05)+hueDrift;
    const grad = ctx.createRadialGradient(0,0,0,0,0,pulse*2.6);
    grad.addColorStop(0, `hsla(${coreHue},85%,72%,0.9)`);
    grad.addColorStop(0.35, `hsla(${coreHue},80%,60%,0.35)`);
    grad.addColorStop(1, `hsla(${coreHue},80%,50%,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0,0,pulse*2.6,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = `hsla(${coreHue},70%,85%,0.9)`;
    ctx.beginPath();
    ctx.arc(0,0,pulse*0.55,0,Math.PI*2);
    ctx.fill();

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.radius += p.speed;
      p.life -= p.decay;
      if (p.life<=0){ particles.splice(i,1); continue; }
      const x = Math.cos(p.ang)*p.radius, y = Math.sin(p.ang)*p.radius;
      ctx.fillStyle = `hsla(${p.hue},80%,70%,${p.life*0.8})`;
      ctx.beginPath();
      ctx.arc(x,y,p.size,0,Math.PI*2);
      ctx.fill();
    }

    if (!analyser){
      const idleR = coreBase*1.6 + Math.sin(idlePhase)*6;
      for(let i=0;i<48;i++){
        const ang = (i/48)*Math.PI*2;
        const len = ringInner*0.5 + Math.sin(idlePhase*1.3+i*0.5)*minDim*0.02;
        const x0=Math.cos(ang)*ringInner*0.5, y0=Math.sin(ang)*ringInner*0.5;
        const x1=Math.cos(ang)*(ringInner*0.5+len*0.3), y1=Math.sin(ang)*(ringInner*0.5+len*0.3);
        ctx.strokeStyle = 'hsla(38,60%,60%,0.12)';
        ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
      }
    }

    ctx.restore();
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
